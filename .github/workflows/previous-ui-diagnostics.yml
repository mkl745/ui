name: Previous UI diagnostics
on:
  push:
permissions:
  actions: read
  contents: read
  checks: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Publish earlier UI report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/old-ui"
          gh run download 41651441024 -n orbit-ui-test-report -D "$RUNNER_TEMP/old-ui" --repo "$GITHUB_REPOSITORY"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from html.parser import HTMLParser
          class Text(HTMLParser):
              def __init__(self): super().__init__(); self.parts = []
              def handle_data(self, data): self.parts.append(data)
          chunks = []
          for path in Path(os.environ['RUNNER_TEMP'], 'old-ui').rglob('*.html'):
              parser = Text(); parser.feed(path.read_text(errors='replace'))
              chunks.append('\n### ' + path.name + '\n' + ' '.join(x.strip() for x in parser.parts if x.strip()))
          payload = {'name': 'Previous UI report', 'head_sha': os.environ['GITHUB_SHA'], 'status': 'completed', 'conclusion': 'neutral', 'output': {'title': 'Previous emulator test report', 'summary': 'Captured output from the previous test report.', 'text': '\n'.join(chunks)[:60000]}}
          Path(os.environ['RUNNER_TEMP'], 'old-ui-report.json').write_text(json.dumps(payload))
          PY
          gh api "repos/$GITHUB_REPOSITORY/check-runs" --method POST --input "$RUNNER_TEMP/old-ui-report.json"
