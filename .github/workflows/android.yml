name: Android build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :baselineprofile:assembleBenchmarkRelease :app:lintDebug :core:domain:test 2>&1 | tee "$RUNNER_TEMP/gradle-output.txt"
      - name: Publish build diagnostics
        if: steps.build.outcome == 'failure' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP'], 'gradle-output.txt').read_text(errors='replace')[-50000:]
          payload = {'name': 'Android build diagnostics', 'head_sha': os.environ['GITHUB_SHA'], 'status': 'completed', 'conclusion': 'failure', 'output': {'title': 'Gradle build failed', 'summary': 'See the captured Gradle output.', 'text': '```\n' + log.replace('```', "'''") + '\n```'}}
          Path(os.environ['RUNNER_TEMP'], 'diagnostics.json').write_text(json.dumps(payload))
          PY
          gh api "repos/$GITHUB_REPOSITORY/check-runs" --method POST --input "$RUNNER_TEMP/diagnostics.json"
      - name: Fail on build error
        if: steps.build.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: orbit-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  ui-tests:
    if: github.event_name == 'workflow_dispatch'
    needs: debug
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-ui-test-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
